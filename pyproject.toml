[project]
name = "ferry"
version = "0.1.0"
description = "A control plane for remote, low-communication (DiLoCo-style) training workloads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "grpcio>=1.85.3",
    "numpy>=2.5.5",
    "prometheus-client>=0.26.0",
    "protobuf>=7.36.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[project.scripts]
ferry = "ferry.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/ferry/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
